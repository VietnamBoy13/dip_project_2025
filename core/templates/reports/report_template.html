<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Отчёт теста: {{ run.name }}</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/monokai.min.css">
  <style>
    body { padding: 40px; background: #f8f9fa; }
    .report-header { margin-bottom: 30px; }
    pre { border-radius:5px; padding:15px; overflow-x:auto; }
  </style>
</head>
<body class="container">
  <div class="report-header">
    <h1 class="text-primary">Тест: <strong>{{ run.name }}</strong></h1>
    <p class="text-muted">Дата: {{ run.created_at }}</p>
    <p>Статус:
      <span class="badge {% if run.status == "success" %}bg-success{% else %}bg-danger{% endif %}">
    </p>
  </div>

  <h4>Лог выполнения:</h4>
  <pre><code class="plaintext">{{ log_content }}</code></pre>

  <a href="{% url 'home' %}" class="btn btn-secondary mt-4">← Назад</a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script>hljs.highlightAll();</script>
</body>
</html>
