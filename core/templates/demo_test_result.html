<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <title>Результат демо-теста</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="container mt-5">
    <h1>Результат демо-теста</h1>

    {% if result.passed %}
        <div class="alert alert-success">Тест успешно пройден!</div>
    {% else %}
        <div class="alert alert-danger">Тест провален: {{ result.error }}</div>
    {% endif %}

    <h4>Лог теста:</h4>
    <pre style="background:#f8f9fa; padding:15px; border-radius:5px;">{{ result.log }}</pre>

    <a href="{% url 'home' %}" class="btn btn-secondary mt-3">← Назад</a>
</body>
</html>
